<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2a2356">
<title>EvoLab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="rotate"><div><b>↻</b>Vire o celular de lado pra jogar</div></div>

<section id="home" class="screen">
  <aside class="brand">
    <h1 class="logo">Evo<span>Lab</span></h1>
    <p class="tag">Monte um jogo, solte as IAs e veja elas aprenderem sozinhas.</p>
    <h2>Criar jogo novo</h2>
    <div id="templates"></div>
    <div class="chips"><button id="btImport" class="small">📥 Importar código</button><button id="btSound" class="small"></button></div>
  </aside>
  <main>
    <h2>Seus jogos</h2>
    <div id="games"></div>
  </main>
</section>

<section id="editor" class="screen" hidden>
  <div class="edTop">
    <button data-back class="round">‹</button>
    <input id="edName" maxlength="30" autocomplete="off" placeholder="Nome do jogo">
    <button id="edPlay" class="small">▶ Testar</button>
    <button id="edTrain" class="small primary">🧠 Treinar IAs</button>
  </div>
  <div class="edBody">
    <div class="edLeft">
      <div id="edStage"><canvas id="edCv"></canvas><div id="edBadge"></div><div id="edActs"></div></div>
      <div id="edTools"></div>
    </div>
    <div class="edRight panel">
      <div class="seg" id="edTabs"></div>
      <div id="edPane"></div>
    </div>
  </div>
</section>

<section id="run" class="screen" hidden>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="hud tl">
      <button data-back class="round">‹</button>
      <div class="pill" id="hudStats">
        <span>Geração <b id="stGen">1</b></span>
        <span>Vivas <b id="stAlive">0</b></span>
        <span>Pontos <b id="stScore">0</b></span>
        <span><b id="stLives"></b></span>
        <span>Recorde <b id="stRec">0</b></span>
      </div>
    </div>
    <div class="hud tr"><button id="btSide" class="round">🧠</button></div>
    <div class="hud br" id="speedBox">
      <button id="btPause" class="round">❚❚</button>
      <div class="seg" id="speeds">
        <button data-s="1">1x</button><button data-s="2">2x</button><button data-s="5">5x</button><button data-s="20">20x</button><button data-s="max">MAX</button>
      </div>
    </div>
    <div id="playCtl"></div>
    <div id="toast"></div>
    <div id="overMsg" hidden>
      <div class="box">
        <b id="overTitle"></b>
        <p id="overText"></p>
        <div class="actions"><button id="overAgain" class="primary">De novo</button><button data-back>Sair</button></div>
      </div>
    </div>
  </div>
  <aside id="side" class="panel">
    <div class="row">
      <button id="btPrev" class="round">◀</button>
      <div class="who"><small>Seguindo</small><b id="stWho">—</b></div>
      <button id="btNext" class="round">▶</button>
    </div>
    <div class="row">
      <button id="btBest" class="grow small">Seguir a melhor</button>
      <button id="btSolo" class="grow small">Ver só ela</button>
    </div>
    <h3>Cérebro dela</h3>
    <canvas id="nn"></canvas>
    <h3>Evolução <small><i class="k1"></i>melhor <i class="k2"></i>média</small></h3>
    <canvas id="graph"></canvas>
    <details>
      <summary>Ajustes do treino</summary>
      <div id="cfg"></div>
    </details>
    <div class="actions">
      <button id="btSkip" class="small">Pular geração</button>
      <button id="btReset" class="small danger">Zerar treino</button>
    </div>
  </aside>
</section>

<div id="modal" hidden>
  <div class="box">
    <b>Importar jogo</b>
    <p>Cole aqui o código que um amigo mandou.</p>
    <textarea id="impText" class="code" placeholder="EVO1...."></textarea>
    <p id="impErr"></p>
    <div class="actions"><button id="impOk" class="primary">Importar</button><button id="impNo">Cancelar</button></div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/games.js"></script>
<script src="js/app.js"></script>
</body>
</html>
