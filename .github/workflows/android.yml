name: APK Android

on:
  push:
    branches: [main, ccr-4cb006b9-964kqn]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Instalar dependências
        run: npm install
      - name: Montar arquivos do jogo
        run: npm run build:web
      - name: Criar projeto Android
        run: |
          npx cap add android
          bash scripts/android-tweaks.sh
          npx cap sync android
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Voxilia.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Voxilia-apk
          path: Voxilia.apk
      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Voxília (APK mais recente)
          body: "APK de teste gerado automaticamente a partir da branch ${{ github.ref_name }} (commit ${{ github.sha }}). Baixe Voxilia.apk e instale no Android (permita instalar de fontes desconhecidas)."
          prerelease: true
          make_latest: true
          files: Voxilia.apk
