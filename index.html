<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffe9c9" />
    <title>Vale Brisa</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="touch"></div>

    <div id="hud" class="hidden">
      <div id="tag" class="box"></div>
      <button id="btn-pause" class="btn small" aria-label="Pausar"><span class="pause-ico"></span></button>
      <div id="stick"><div class="knob"></div></div>
    </div>

    <div id="menu" class="screen">
      <div class="logo">
        <div class="logo-main">Vale Brisa</div>
        <div class="logo-sub">sua fazendinha te espera</div>
      </div>
      <div class="menu-buttons">
        <button id="btn-continue" class="btn big hidden">Continuar</button>
        <button id="btn-new" class="btn big">Novo Jogo</button>
      </div>
      <div class="version">v0.3.0</div>
    </div>

    <div id="creator" class="screen hidden">
      <div class="creator-hint">arraste para girar</div>
      <div class="panel box">
        <div class="panel-title">Criar Personagem</div>
        <div id="creator-rows" class="rows"></div>
        <div class="panel-actions">
          <button id="btn-back" class="btn">Voltar</button>
          <button id="btn-random" class="btn">Aleatório</button>
          <button id="btn-start" class="btn primary">Começar!</button>
        </div>
      </div>
    </div>

    <div id="pause" class="screen hidden">
      <div class="panel box center">
        <div class="panel-title">Pausa</div>
        <button id="btn-resume" class="btn big primary">Continuar</button>
        <div class="row">
          <label>Gráficos</label>
          <div class="cycle"><button class="btn small" id="q-prev">&lt;</button><span id="q-label"></span><button class="btn small" id="q-next">&gt;</button></div>
        </div>
        <div class="row">
          <label>Câmera</label>
          <div class="cycle"><button class="btn small" id="z-prev">&lt;</button><span id="z-label"></span><button class="btn small" id="z-next">&gt;</button></div>
        </div>
        <button id="btn-edit" class="btn big">Editar personagem</button>
        <button id="btn-quit" class="btn big">Menu inicial</button>
      </div>
    </div>

    <div id="loading">Carregando...</div>
    <div id="rotate">Vire o celular de lado</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
